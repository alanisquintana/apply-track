name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - uses: actions-rust-lang/setup-rust@v1
        with:
          rustflags: ''

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Build backend SEA binary
        run: node build-sea.js
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npx vite build
        working-directory: frontend

      - name: Build Tauri app
        run: npx tauri build
        working-directory: frontend

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ApplyTrack-x64-en-US
          path: frontend/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ApplyTrack-x64-setup
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
